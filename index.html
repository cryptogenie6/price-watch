<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PRICE WATCH</title>
<style>
  :root {
    --bg: #0a0c0a;
    --card: #121412;
    --text: #c8c8c0;
    --muted: #6a6a62;
    --green: #4a7c59;
    --red: #8b3a3a;
    --accent: #8a8a78;
    --border: #1e211e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 8px 70px;
  }
  h1 {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .ticker {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    width: 100%;
    max-width: 340px;
  }
  .coin {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 1px;
    padding: 6px 4px;
    text-align: center;
  }
  .symbol { font-size: 11px; font-weight: 600; letter-spacing: 1px; color: var(--accent); }
  .name { font-size: 7px; color: var(--muted); letter-spacing: 0.3px; margin-bottom: 3px; text-transform: uppercase; }
  .price { font-size: 15px; font-weight: 500; letter-spacing: -0.2px; }
  .change { margin-top: 2px; font-size: 10px; font-weight: 600; }
  .change.up { color: var(--green); }
  .change.down { color: var(--red); }
  .label { font-size: 6px; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; margin-top: 1px; }
  .controls {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 8px 8px 12px;
    background: linear-gradient(transparent, var(--bg) 30%);
    text-align: center;
  }
  button {
    background: transparent;
    color: var(--text);
    border: 1px solid #2a2d2a;
    border-radius: 1px;
    padding: 8px 16px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    cursor: pointer;
    font-family: inherit;
  }
  button:active { background: #1a1c1a; }
  button:disabled { opacity: 0.4; }
  .status { font-size: 8px; color: var(--muted); letter-spacing: 0.8px; margin-top: 6px; text-transform: uppercase; }
  .error { color: var(--red); font-size: 11px; text-align: center; padding: 16px; }
  @media (min-width: 480px) {
    .ticker { grid-template-columns: repeat(4, 1fr); max-width: 560px; }
  }
</style>
</head>
<body>
<h1>Price Watch</h1>
<div class="ticker" id="ticker"></div>

<div class="controls">
  <button id="refreshBtn" onclick="manualRefresh()">Update</button>
  <div class="status" id="status">Standby</div>
</div>

<script>
const COINS = [
  { symbol: "SOL", name: "Solana", pair: "SOL-USD" },
  { symbol: "ETH", name: "Ethereum", pair: "ETH-USD" },
  { symbol: "XRP", name: "Ripple", pair: "XRP-USD" },
  { symbol: "BTC", name: "Bitcoin", pair: "BTC-USD" },
];
const REFRESH_SECONDS = 30;
let isLoading = false;

async function fetchPrices() {
  if (isLoading) return;
  isLoading = true;
  const btn = document.getElementById("refreshBtn");
  const status = document.getElementById("status");
  btn.disabled = true;
  btn.textContent = "Updating";
  status.textContent = "Acquiring";

  try {
    const results = await Promise.all(
      COINS.map(async (coin) => {
        const res = await fetch(`https://api.exchange.coinbase.com/products/${coin.pair}/stats`);
        if (!res.ok) throw new Error("fail");
        const stats = await res.json();
        const price = parseFloat(stats.last);
        const open = parseFloat(stats.open);
        const change = open ? ((price - open) / open) * 100 : 0;
        return { ...coin, price, change };
      })
    );
    render(results);
    status.textContent = "Synced " + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
  } catch (e) {
    status.textContent = "Link Failed";
    if (!document.querySelector(".coin")) {
      document.getElementById("ticker").innerHTML = `<div class="error">No Signal</div>`;
    }
  } finally {
    isLoading = false;
    btn.disabled = false;
    btn.textContent = "Update";
  }
}

function render(coins) {
  const container = document.getElementById("ticker");
  container.innerHTML = coins.map(coin => {
    const price = coin.price;
    const change = coin.change;
    const cls = change >= 0 ? "up" : "down";
    const sign = change >= 0 ? "+" : "";
    const priceStr = price >= 1000
      ? price.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 0 })
      : price >= 1
        ? price.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })
        : price.toFixed(4);
    return `
      <div class="coin">
        <div class="symbol">${coin.symbol}</div>
        <div class="name">${coin.name}</div>
        <div class="price">$${priceStr}</div>
        <div class="change ${cls}">${sign}${change.toFixed(2)}%</div>
        <div class="label">24h</div>
      </div>
    `;
  }).join("");
}

function manualRefresh() { fetchPrices(); }
fetchPrices();
setInterval(fetchPrices, REFRESH_SECONDS * 1000);
</script>
</body>
</html>
