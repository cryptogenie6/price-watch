<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PRICE WATCH</title>
<style>
  :root {
    --bg: #0a0c0a;
    --card: #121412;
    --text: #c8c8c0;
    --muted: #6a6a62;
    --green: #4a7c59;
    --red: #8b3a3a;
    --accent: #8a8a78;
    --border: #1e211e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 16px 10px 100px;
  }
  h1 {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .ticker {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    width: 100%;
    max-width: 380px;
  }
  .coin {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 10px 6px;
    text-align: center;
  }
  .symbol { font-size: 13px; font-weight: 600; letter-spacing: 1.2px; color: var(--accent); }
  .name { font-size: 9px; color: var(--muted); letter-spacing: 0.5px; margin-bottom: 6px; text-transform: uppercase; }
  .price { font-size: 18px; font-weight: 500; letter-spacing: -0.3px; }
  .change { margin-top: 4px; font-size: 12px; font-weight: 600; }
  .change.up { color: var(--green); }
  .change.down { color: var(--red); }
  .label { font-size: 8px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }
  .controls {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 12px 10px 16px;
    background: linear-gradient(transparent, var(--bg) 35%);
    text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  button {
    background: transparent;
    color: var(--text);
    border: 1px solid #2a2d2a;
    border-radius: 2px;
    padding: 10px 20px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    font-family: inherit;
    min-width: 160px;
  }
  button:active { background: #1a1c1a; }
  button:disabled { opacity: 0.4; }
  #floatBtn { border-color: #3a3d3a; }
  .status { font-size: 9px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .error { color: var(--red); font-size: 12px; text-align: center; padding: 20px; }
  video#pipVideo { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  @media (min-width: 500px) {
    .ticker { grid-template-columns: repeat(4, 1fr); max-width: 640px; }
  }
</style>
</head>
<body>
<h1>Price Watch</h1>
<div class="ticker" id="ticker"></div>
<video id="pipVideo" playsinline muted></video>

<div class="controls">
  <button id="floatBtn" onclick="tryFloat()">Float</button>
  <button id="refreshBtn" onclick="manualRefresh()">Update</button>
  <div class="status" id="status">Standby</div>
</div>

<script>
const COINS = [
  { symbol: "SOL", name: "Solana", pair: "SOL-USD" },
  { symbol: "ETH", name: "Ethereum", pair: "ETH-USD" },
  { symbol: "XRP", name: "Ripple", pair: "XRP-USD" },
  { symbol: "BTC", name: "Bitcoin", pair: "BTC-USD" },
];
const REFRESH_SECONDS = 30;
let isLoading = false;
let lastCoins = [];

async function fetchPrices() {
  if (isLoading) return;
  isLoading = true;
  const btn = document.getElementById("refreshBtn");
  const status = document.getElementById("status");
  btn.disabled = true;
  btn.textContent = "Updating";
  status.textContent = "Acquiring";

  try {
    const results = await Promise.all(
      COINS.map(async (coin) => {
        const res = await fetch(`https://api.exchange.coinbase.com/products/${coin.pair}/stats`);
        if (!res.ok) throw new Error("fail");
        const stats = await res.json();
        const price = parseFloat(stats.last);
        const open = parseFloat(stats.open);
        const change = open ? ((price - open) / open) * 100 : 0;
        return { ...coin, price, change };
      })
    );
    lastCoins = results;
    render(results);
    status.textContent = "Synced " + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
  } catch (e) {
    status.textContent = "Link Failed";
    if (!document.querySelector(".coin")) {
      document.getElementById("ticker").innerHTML = `<div class="error">No Signal</div>`;
    }
  } finally {
    isLoading = false;
    btn.disabled = false;
    btn.textContent = "Update";
  }
}

function render(coins) {
  const container = document.getElementById("ticker");
  container.innerHTML = coins.map(coin => {
    const price = coin.price;
    const change = coin.change;
    const cls = change >= 0 ? "up" : "down";
    const sign = change >= 0 ? "+" : "";
    const priceStr = price >= 1000
      ? price.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 0 })
      : price >= 1
        ? price.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })
        : price.toFixed(4);
    return `
      <div class="coin">
        <div class="symbol">${coin.symbol}</div>
        <div class="name">${coin.name}</div>
        <div class="price">$${priceStr}</div>
        <div class="change ${cls}">${sign}${change.toFixed(2)}%</div>
        <div class="label">24h</div>
      </div>
    `;
  }).join("");
}

async function tryFloat() {
  const video = document.getElementById("pipVideo");
  const canvas = document.createElement("canvas");
  canvas.width = 320;
  canvas.height = 180;
  const ctx = canvas.getContext("2d");

  function drawFrame() {
    ctx.fillStyle = "#0a0c0a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#c8c8c0";
    ctx.font = "bold 14px monospace";
    ctx.fillText("PRICE WATCH", 10, 20);
    lastCoins.forEach((c, i) => {
      const y = 50 + i * 30;
      const priceStr = c.price >= 1000 ? Math.round(c.price).toLocaleString() : c.price.toFixed(2);
      const sign = c.change >= 0 ? "+" : "";
      ctx.fillStyle = "#8a8a78";
      ctx.font = "13px monospace";
      ctx.fillText(c.symbol, 10, y);
      ctx.fillStyle = "#c8c8c0";
      ctx.fillText("$" + priceStr, 70, y);
      ctx.fillStyle = c.change >= 0 ? "#4a7c59" : "#8b3a3a";
      ctx.fillText(sign + c.change.toFixed(1) + "%", 180, y);
    });
  }

  drawFrame();
  const stream = canvas.captureStream(2);
  video.srcObject = stream;
  video.play();

  try {
    if (document.pictureInPictureEnabled) {
      await video.requestPictureInPicture();
    } else {
      alert("Float not supported in this browser. Try Safari or Chrome.");
    }
  } catch (e) {
    alert("Could not float. Make sure Picture-in-Picture is allowed.");
  }

  setInterval(drawFrame, 5000);
}

function manualRefresh() { fetchPrices(); }
fetchPrices();
setInterval(fetchPrices, REFRESH_SECONDS * 1000);
</script>
</body>
</html>
